<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Invitaciones - Lucia & Julio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f4f1ea] min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full border-t-8 border-[#1a3016]">
        <h1 class="font-cinzel text-2xl text-center text-[#1a3016] mb-6">GENERADOR DE LINKS</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nombre del Invitado</label>
                <input type="text" id="invitado" placeholder="Ej: Familia Julio y Lucia" class="w-full p-3 border rounded border-gray-300 focus:outline-[#c5a059]">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Número de Pases</label>
                <input type="number" id="pases" placeholder="Cantidad de Personas" class="w-full p-3 border rounded border-gray-300 focus:outline-[#c5a059]">
            </div>

            <button onclick="generarLink()" class="w-full bg-[#1a3016] text-white p-4 rounded-lg font-bold hover:bg-[#c5a059] transition-colors">
                GENERAR Y COPIAR LINK
            </button>
        </div>

        <div id="resultado" class="hidden mt-6 p-4 bg-gray-100 rounded break-all text-sm text-gray-600 border-l-4 border-[#c5a059]">
            <p id="url-final"></p>
        </div>
    </div>

    <script>
        function generarLink() {
            const nombre = document.getElementById('invitado').value.trim().replace(/ /g, "_");
            const pases = document.getElementById('pases').value;
            
            if(!nombre || !pases) { alert("Por favor llena ambos campos"); return; }

            // IMPORTANTE: Cambia esta URL por la URL real de tu invitación
            // const urlBase = window.location.href.replace('generador.html', 'index.html'); GENERADOR DESDE MI EQUIPO LOCAL, DESMARCAR AL INICIO (//) SI NECESITO HACERLO LOCAL EN MI PC
            const urlBase = "https://quiroaoscar.github.io/boda/index.html"; //GENERADOR DESDE GITHUB, MARCAR O DESMARCAR AL INICIO (//) SI NECESITO HACERLO EN LINEA DESDE GITHUB
            const linkFinal = `${urlBase}?n=${nombre}&p=${pases}`;

            // Copiar al portapapeles automáticamente
            navigator.clipboard.writeText(linkFinal);
            
            // Mostrar resultado
            document.getElementById('resultado').classList.remove('hidden');
            document.getElementById('url-final').innerText = "¡Copiado! Ya puedes pegarlo en WhatsApp: " + linkFinal;
            
            alert("¡Link generado y copiado al portapapeles!");
        }
    </script>
</body>
</html>
