<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="petals-container"></div>

    <button id="music-btn">🎵</button>
    <audio id="bg-music" loop src="assets/musica.mp3"></audio>

    <section class="hero">
        <div class="monograma">L & J</div>
        <h1>¡Nos Casamos!</h1>
        <div id="timer"></div>
    </section>

    <section class="pases-seccion">
        <p>Lugares reservados para ti:</p>
        <div id="guest-pases">--</div>
    </section>

    <div class="slider-container">
        <div id="slider"></div>
    </div>

    <div class="form-box">
        <h3>Confirmar Asistencia</h3>
        <form id="rsvp-form">
            <input type="text" id="nombre" placeholder="Tu nombre" required>
            <select id="asistencia">
                <option value="Si">Asistiré</option>
                <option value="No">No podré ir</option>
            </select>
            <button type="submit" id="submit-btn">Enviar</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
